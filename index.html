<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>▶️</title>
  <style>
    body { margin: 0; font-family: "ＭＳ Ｐゴシック", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111; color: #fff; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    .player-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
    .player-wrap.inverted { filter: invert(1); }
    .player-wrap:fullscreen, .player-wrap:-webkit-full-screen { border-radius: 0; }
    #player { width: 100%; height: 100%; }
    .message { margin-top: 16px; line-height: 1.7; color: #ddd; word-break: break-all; }
    .controls { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .range-pill, .host-switch, .embed-switch, .loop-switch, .countin-switch { display: inline-flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 999px; background: #222; font-size: 14px; font-weight: 700; user-select: none; }
    .range-pill input[type="range"] { width: 110px; }
    .host-switch, .embed-switch, .loop-switch, .countin-switch { cursor: pointer; }
    .host-switch input, .embed-switch input, .loop-switch input, .countin-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch-slider { position: relative; width: 38px; height: 22px; border-radius: 999px; background: #555; }
    .switch-slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; border-radius: 50%; background: #e6ebef; transition: transform .16s ease; }
    .host-switch input:checked + .switch-slider, .embed-switch input:checked + .switch-slider, .loop-switch input:checked + .switch-slider, .countin-switch input:checked + .switch-slider { background: #627b8c; }
    .host-switch input:checked + .switch-slider::before, .embed-switch input:checked + .switch-slider::before, .countin-switch input:checked + .switch-slider::before { transform: translateX(16px); background: #e6ebef; }
    .speed-control, .time-control { margin-top: 16px; padding: 14px; border: 1px solid #333; border-radius: 12px; background: #181818; }
    .speed-control label, .time-label-row { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; margin-bottom: 10px; }
    .speed-presets, .speed-stepper { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .speed-presets button, .speed-stepper button { min-width: 54px; padding: 9px 12px; }
    .speed-preset.active { background: #ddd; }
    .speed-current { min-width: 72px; text-align: center; font-weight: 800; }
    .loop-meta { display: flex; justify-content: space-between; margin-top: 6px; color: #aaa; font-size: 12px; }
    .time-track { position: relative; height: 114px; margin: 12px 28px 0; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
    .time-track::before { content: ""; position: absolute; left: 0; right: 0; top: 46px; height: 4px; border-radius: 999px; background: #333; }
    .time-progress, .loop-range { position: absolute; border-radius: 999px; pointer-events: none; }
    .time-progress { left: 0; top: 46px; height: 4px; width: 0%; background: #777; }
    .loop-range { left: 0%; top: 44px; height: 8px; width: 100%; background: #77978c; z-index: 1; }
    .loop-handle { position: absolute; box-sizing: border-box; width: 54px; height: 50px; min-width: 54px; padding: 0; transform: translateX(-50%); border: 2px solid #111; border-radius: 12px; font-size: 19px; font-weight: 800; z-index: 2; box-shadow: 0 2px 8px #0007; user-select: none; touch-action: none; }
    .loop-start { top: 0; left: 0%; background: #476b5b; color: #eef4ee; }
    .loop-end { top: 64px; left: 100%; background: #79634b; color: #f5eee4; }
    .loop-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .time-control { margin-top: 8px; }
    .time-control .time-label-row { align-items: baseline; }
    .time-control .loop-meta { flex-wrap: wrap; gap: 4px 12px; }
    .loop-points { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .loop-point-card { min-width: 0; padding: 9px; border: 1px solid #444; border-radius: 12px; background: #202020; }
    .loop-set-button { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; box-sizing: border-box; width: 100%; min-height: 80px; padding: 10px 12px; border: 2px solid #57796c; border-radius: 10px; background: #29362f; color: #e8ede9; text-align: left; }
    .loop-set-button.loop-set-end { border-color: #8c765f; background: #373229; }
    .loop-set-label { font-size: 14px; font-weight: 700; }
    .loop-set-time { font-size: clamp(17px, 4.8vw, 24px); font-weight: 800; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .loop-set-hint { font-size: 11px; color: #bbb; font-weight: 500; }
    .loop-nudge { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .loop-nudge button { min-height: 44px; padding: 8px 4px; border-radius: 9px; background: #353e46; color: #e8ebef; font-size: 14px; }
    .loop-actions > button { min-height: 44px; }
    .loop-set-button:focus-visible, .loop-handle:focus-visible, .loop-nudge button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    /* Desktop: full-width 16:9 video, compact centered controls. */
    @media (min-width: 768px) {
      main { max-width: none; padding: 0; }
      /* Keep the picture at its natural ratio and create room for YouTube's lower controls. */
      .player-wrap { width: 100%; aspect-ratio: auto; height: calc(56.25vw + 200px); }
      main > :not(.player-wrap) {
        box-sizing: border-box;
        width: min(960px, calc(100% - 48px));
        margin-left: auto;
        margin-right: auto;
      }
    }
    @media (max-width: 767px) {
      /* Extra height produces letterboxing around 16:9 video, without stretching it. */
      .player-wrap { aspect-ratio: auto; height: calc(56.25vw + 108px); }
    }
    @media (max-width: 600px) {
      main { padding: 12px; }
      .time-control { padding: 12px; }
      .loop-points { gap: 8px; }
      .loop-point-card { padding: 7px; }
      .loop-set-button { padding: 9px; }
      .loop-set-label { font-size: 13px; }
      .loop-nudge { gap: 5px; }
      .loop-nudge button { font-size: 13px; }
    }
    .countin-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
    .bpm-control { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; }
    .bpm-control input { box-sizing: border-box; width: 76px; padding: 7px 8px; border: 1px solid #59636b; border-radius: 8px; background: #293139; color: #e9edf0; font: inherit; }
    .bpm-current { font-size: 13px; color: #bbb; }
    .countin-overlay { position: absolute; inset: 0; z-index: 3; pointer-events: none; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.42); color: #fff; font-size: clamp(40px, 9vw, 90px); font-weight: 800; text-shadow: 0 3px 12px #000; }
    .countin-overlay.visible { display: flex; }
    /* Compact, readable control surfaces. All frequently used targets remain at least 44px tall. */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .time-control, .speed-control { padding: 12px; }
    .time-control { margin-top: 8px; }
    .time-track { height: 96px; margin-top: 8px; }
    /* Thin unselected track (4px), highlighted A-B interval (8px), aligned centerline. */
    .loop-handle { min-width: 46px; width: 46px; height: 44px; border-radius: 10px; font-size: 17px; }
    .loop-end { top: 52px; }
    .time-control .loop-meta { margin-top: 0; }
    .loop-points { gap: 8px; margin-top: 8px; }
    .loop-point-card { padding: 7px; }
    .loop-set-button { min-height: 62px; padding: 8px 10px; }
    .loop-set-label { font-size: 13px; }
    .loop-set-time { font-size: clamp(16px, 4.5vw, 22px); }
    .loop-nudge { gap: 6px; margin-top: 6px; }
    .loop-nudge button { min-height: 44px; }
    .loop-options { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .loop-options .loop-switch, .loop-options .countin-switch { min-height: 44px; box-sizing: border-box; }
    .loop-options .bpm-current { font-variant-numeric: tabular-nums; }
    .bpm-control input { min-height: 40px; }
    .loop-actions { margin-top: 8px; }
    .loop-actions button { flex: 1; }
    .controls { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 6px; margin-top: 8px; }
    .controls button { min-height: 44px; min-width: 0; padding: 8px 4px; }
    #playerToggle { background: #465e6b; border-color: #627988; color: #f0f4f6; }
    .speed-control { margin-top: 8px; }
    .speed-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; }
    .speed-stepper { display: flex; gap: 6px; align-items: center; margin: 0; }
    .speed-stepper button { min-width: 48px; min-height: 44px; padding: 8px; }
    .speed-presets { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 5px; margin: 8px 0 0; }
    .speed-presets button { min-width: 0; min-height: 44px; padding: 8px 2px; font-size: 13px; }
    .speed-preset.active { background: #506676; color: #f4f6f8; border-color: #728b9b; box-shadow: inset 0 0 0 1px #728b9b; }
    .advanced-settings { margin-top: 8px; padding: 8px 12px; border: 1px solid #333; border-radius: 12px; background: #181818; }
    .advanced-heading { min-height: 28px; line-height: 28px; font-weight: 700; }
    .advanced-heading span { color: #aeb7bf; font-size: 12px; font-weight: 400; padding-left: 8px; }
    .advanced-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .advanced-controls button { min-height: 44px; }
    .message { margin-top: 8px; font-size: 13px; }
    .bookmarklet-section { margin-top: 40px; padding-top: 24px; border-top: 1px solid #333; }
    .bookmarklet-section h2 { margin: 0 0 12px; font-size: 18px; }
    .bookmarklet-code { display: block; box-sizing: border-box; width: 100%; min-height: 96px; margin-top: 16px; padding: 12px; border: 1px solid #333; border-radius: 10px; background: #222; color: #fff; font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; resize: vertical; word-break: break-all; }
    .bookmarklet-copy-row { margin-top: 12px; }
    button, .bookmarklet-button { appearance: none; border: 1px solid #55616c; border-radius: 999px; padding: 10px 16px; font-size: 14px; cursor: pointer; background: #35414b; color: #edf0f3; font-weight: 700; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: background-color .16s ease, border-color .16s ease; }
    /* Enlarged Loop switch with clearly visible current state. */
    .loop-options .loop-switch {
      min-height: 58px;
      min-width: 174px;
      padding: 9px 13px;
      gap: 12px;
      justify-content: space-between;
      border: 1px solid #586673;
      border-radius: 12px;
      background: #303d47;
      color: #f0f2f4;
      font-size: 17px;
      font-weight: 800;
      transition: background-color .16s ease, border-color .16s ease;
    }
    .loop-options .loop-switch.is-on {
      background: #3d584e;
      border-color: #76968a;
    }
    .loop-switch-state {
      min-width: 27px;
      color: #bcc7ce;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .03em;
    }
    .loop-switch.is-on .loop-switch-state { color: #d8e9dd; }
    .loop-switch .switch-slider { width: 58px; height: 32px; flex: 0 0 58px; background: #56616b; }
    .loop-switch .switch-slider::before { width: 26px; height: 26px; top: 3px; left: 3px; background: #e6ebef; }
    .loop-switch input:checked + .switch-slider { background: #648878; }
    .loop-switch input:checked + .switch-slider::before { transform: translateX(26px); background: #e6ebef; }
    .loop-switch:focus-within { outline: 2px solid #9bafbd; outline-offset: 2px; }
    .host-switch:focus-within, .embed-switch:focus-within, .countin-switch:focus-within { outline: 2px solid #9bafbd; outline-offset: 2px; }
    button:hover { background-color: #45525e; border-color: #72828f; }
    #playerToggle:hover { background-color: #547080; }
    .speed-preset.active:hover { background-color: #566f81; }
    .loop-nudge button:hover { background-color: #47555f; }
    .loop-set-button:hover { background-color: #36483f; }
    .loop-set-button.loop-set-end:hover { background-color: #483d32; }
    button:focus-visible { outline: 2px solid #a9bbc9; outline-offset: 2px; }
    @media (max-width: 600px) {
      .loop-options .loop-switch { min-height: 56px; min-width: 174px; }
    }
    code { background: #222; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="player-wrap" id="playerWrap"><div id="player"></div><div class="countin-overlay" id="countInOverlay" aria-live="off" aria-hidden="true"></div></div>

    <div class="time-control">
      <div class="time-label-row"><span>Loop A - B</span><span id="timeValue">00:00 / 00:00</span></div>
      <div class="time-track" id="timeTrack" aria-label="Playback position and loop range">
        <div class="time-progress" id="timeProgress"></div>
        <div class="loop-range" id="loopRange"></div>
        <button type="button" class="loop-handle loop-start" id="loopStartHandle" aria-label="ループ開始Aを左右に動かす">A</button>
        <button type="button" class="loop-handle loop-end" id="loopEndHandle" aria-label="ループ終了Bを左右に動かす">B</button>
      </div>
      <div class="loop-meta"><span>A・Bをドラッグして調整</span><span class="sr-only" id="loopValue">00:00.0 - 00:00.0</span></div>
      <div class="loop-points">
        <div class="loop-point-card">
          <button type="button" class="loop-set-button" id="loopSetStart" aria-label="現在の再生位置をAに設定">
            <span class="loop-set-label">A 開始位置を設定</span>
            <span class="loop-set-time" id="loopStartValue">00:00.0</span>
          </button>
          <div class="loop-nudge" role="group" aria-label="Aの位置を微調整">
            <button type="button" id="loopStartMinus" aria-label="開始位置Aを0.1秒戻す">-0.1秒</button>
            <button type="button" id="loopStartPlus" aria-label="開始位置Aを0.1秒進める">+0.1秒</button>
          </div>
        </div>
        <div class="loop-point-card">
          <button type="button" class="loop-set-button loop-set-end" id="loopSetEnd" aria-label="現在の再生位置をBに設定">
            <span class="loop-set-label">B 終了位置を設定</span>
            <span class="loop-set-time" id="loopEndValue">00:00.0</span>
          </button>
          <div class="loop-nudge" role="group" aria-label="Bの位置を微調整">
            <button type="button" id="loopEndMinus" aria-label="終了位置Bを0.1秒戻す">-0.1秒</button>
            <button type="button" id="loopEndPlus" aria-label="終了位置Bを0.1秒進める">+0.1秒</button>
          </div>
        </div>
      </div>
      <div class="loop-options">
        <label class="loop-switch" id="loopSwitch"><span>Loop</span><span class="loop-switch-state" id="loopStateLabel">OFF</span><input type="checkbox" id="loopToggle" role="switch"><span class="switch-slider" aria-hidden="true"></span></label>
        <label class="countin-switch"><span>Count-in</span><input type="checkbox" id="countInToggle" checked><span class="switch-slider" aria-hidden="true"></span></label>
        <label class="bpm-control" for="baseBpm"><span>BPM (1x)</span><input type="number" id="baseBpm" min="40" max="300" step="1" value="120" inputmode="numeric"></label>
        <span class="bpm-current" id="effectiveBpm">Now: 120 BPM</span>
      </div>
      <div class="loop-actions">
        <button type="button" id="loopBackStart">Back A</button>
        <button type="button" id="loopReset">Reset</button>
      </div>
    </div>

    <div class="controls" role="group" aria-label="再生操作">
      <button type="button" id="playerToggle" aria-label="再生">Play</button>
      <button type="button" id="speed2Toggle" aria-label="1倍と2倍を切り替える">x2</button>
      <button type="button" id="skipBack10">-10</button>
      <button type="button" id="skipForward10">+10</button>
      <button type="button" id="skipForward90">+90</button>
    </div>

    <div class="speed-control">
      <div class="speed-heading">
        <span>Speed</span>
        <div class="speed-stepper">
          <button type="button" id="speedDown" aria-label="再生速度を0.05倍下げる">-</button>
          <span class="speed-current" id="speedStepValue">1.00x</span>
          <button type="button" id="speedUp" aria-label="再生速度を0.05倍上げる">+</button>
        </div>
      </div>
      <div class="speed-presets" role="group" aria-label="再生速度プリセット">
        <button type="button" class="speed-preset" data-rate="0.5">0.5</button>
        <button type="button" class="speed-preset" data-rate="0.75">0.75</button>
        <button type="button" class="speed-preset" data-rate="1">1x</button>
        <button type="button" class="speed-preset" data-rate="1.25">1.25</button>
        <button type="button" class="speed-preset" data-rate="1.5">1.5</button>
        <button type="button" class="speed-preset" data-rate="2">2x</button>
      </div>
    </div>

    <section class="advanced-settings">
      <div class="advanced-heading">その他の設定 <span>音量・画面表示など</span></div>
      <div class="advanced-controls">
        <button type="button" id="invertToggle">Invert</button>
        <button type="button" id="fullscreenToggle">Full</button>
        <label class="range-pill" for="volumeRange"><span>Vol</span><input type="range" id="volumeRange" min="0" max="100" step="1" value="50"></label>
        <label class="host-switch"><span>Std</span><input type="checkbox" id="hostToggle"><span class="switch-slider" aria-hidden="true"></span><span>NoCookie</span></label>
        <label class="embed-switch"><span>Ctrl (動画内)</span><input type="checkbox" id="controlsToggle"><span class="switch-slider" aria-hidden="true"></span></label>
      </div>
    </section>

    <div class="message" id="message"></div>

    <section class="bookmarklet-section">
      <h2>Bookmarklet</h2>
      <textarea class="bookmarklet-code" id="bookmarkletCode" readonly>javascript:(()=>{const id=new URL(location.href).searchParams.get("v");if(!id){document.title="動画IDが見つかりません";return;}location.href="https://xnvplkd.github.io/z/?v="+encodeURIComponent(id);})();</textarea>
      <div class="bookmarklet-copy-row"><button type="button" id="copyBookmarklet">Copy</button></div>
    </section>
  </main>

  <script>
    const NORMAL_RATE = 1;
    const SPEED_2 = 2;
    const MIN_RATE = .25;
    const MAX_RATE = 2;
    const RATE_STEP = .05;
    const SKIP_10_SECONDS = 10;
    const SKIP_90_SECONDS = 90;
    const LOOP_GAP_SECONDS = .5;
    const COUNT_IN_BEATS = 4;
    const DEFAULT_BPM = 120;
    const MIN_BPM = 40;
    const MAX_BPM = 300;
    const BPM_STORAGE_KEY = "z.baseBpm";
    const COUNT_IN_STORAGE_KEY = "z.countInEnabled";
    const LOOP_PARAM_START = "loopStart";
    const LOOP_PARAM_END = "loopEnd";
    const HOST_PARAM = "host";
    const CONTROLS_PARAM = "controls";
    const YOUTUBE_STANDARD_HOST = "https://www.youtube.com";
    const YOUTUBE_NOCOOKIE_HOST = "https://www.youtube-nocookie.com";
    const BOOKMARKLET_CODE = 'javascript:(()=>{const id=new URL(location.href).searchParams.get("v");if(!id){document.title="動画IDが見つかりません";return;}location.href="https://xnvplkd.github.io/z/?v="+encodeURIComponent(id);})();';

    let player = null;
    let currentRate = NORMAL_RATE;
    let isInverted = false;
    let videoDuration = 0;
    let loopStart = 0;
    let loopEnd = 0;
    let isLoopEnabled = false;
    let activeLoopHandle = null;
    let isDraggingSeek = false;
    let activePointerId = null;
    let hasLoadedLoopFromUrl = false;
    let wakeLockSentinel = null;
    let baseBpm = DEFAULT_BPM;
    let isCountInEnabled = true;
    let countInActive = false;
    let countInGeneration = 0;
    let countInTimeouts = [];
    let countInOscillators = [];
    let countInAudioContext = null;
    let waitingForLoopSeek = false;
    let initialCaptionsHandled = false;

    function applyInitialCaptionsOff() {
      if (initialCaptionsHandled || !player?.getOptions) return;
      try {
        const modules = player.getOptions();
        if (!Array.isArray(modules) || !modules.includes("captions")) return;
        initialCaptionsHandled = true;
        // The track and unloadModule operations are best-effort YouTube behavior,
        // not an officially guaranteed override of viewer caption preferences.
        try { player.setOption?.("captions", "track", {}); } catch (_) {}
        try { player.unloadModule?.("captions"); } catch (_) {}
      } catch (_) {}
    }
    function getParam(name) { return new URLSearchParams(location.search).get(name); }
    function getNumberParam(name) { const value = getParam(name); if (value === null || value === "") return null; const number = Number(value); return Number.isFinite(number) ? number : null; }
    function isNoCookieMode() { return getParam(HOST_PARAM) === "nocookie"; }
    function getYouTubeHost() { return isNoCookieMode() ? YOUTUBE_NOCOOKIE_HOST : YOUTUBE_STANDARD_HOST; }
    function isEmbedControlsEnabled() { return getParam(CONTROLS_PARAM) === "on"; }
    function getEmbedControlsValue() { return isEmbedControlsEnabled() ? 1 : 0; }
    function getFullscreenElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
    function setMessage(text) { document.getElementById("message").innerHTML = text; }
    function isPlayerReady() { return player && typeof player.getCurrentTime === "function"; }
    function formatRate(rate) { return Number(rate).toFixed(2) + "x"; }
    function normalizeRate(rate) { const n = Number(rate); if (!Number.isFinite(n)) return NORMAL_RATE; return Math.round(Math.min(MAX_RATE, Math.max(MIN_RATE, n)) / RATE_STEP) * RATE_STEP; }
    function normalizeBpm(value) { const n = Number(value); return value === "" || value === null || !Number.isFinite(n) ? DEFAULT_BPM : Math.round(Math.max(MIN_BPM, Math.min(MAX_BPM, n))); }
    function effectiveBpm() { return baseBpm * currentRate; }
    function updateBpmControl() {
      document.getElementById("baseBpm").value = String(baseBpm);
      document.getElementById("countInToggle").checked = isCountInEnabled;
      document.getElementById("effectiveBpm").textContent = "Now: " + Number(effectiveBpm().toFixed(2)) + " BPM (" + formatRate(currentRate) + ")";
    }
    function saveCountInSettings() {
      try { localStorage.setItem(BPM_STORAGE_KEY, String(baseBpm)); localStorage.setItem(COUNT_IN_STORAGE_KEY, String(isCountInEnabled)); } catch (_) {}
    }
    function loadCountInSettings() {
      try {
        const savedBpm = localStorage.getItem(BPM_STORAGE_KEY);
        const savedEnabled = localStorage.getItem(COUNT_IN_STORAGE_KEY);
        if (savedBpm !== null) baseBpm = normalizeBpm(savedBpm);
        if (savedEnabled !== null) isCountInEnabled = savedEnabled === "true";
      } catch (_) {}
      updateBpmControl();
    }
    function unlockCountInAudio() {
      if (!isCountInEnabled) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!countInAudioContext) countInAudioContext = new AudioContextClass();
        if (countInAudioContext.state === "suspended") countInAudioContext.resume().catch(() => {});
      } catch (_) {}
    }
    function scheduleCountInClick(at, accented) {
      if (!countInAudioContext || countInAudioContext.state !== "running") return;
      const oscillator = countInAudioContext.createOscillator();
      const gain = countInAudioContext.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(accented ? 1200 : 850, at);
      gain.gain.setValueAtTime(.0001, at);
      gain.gain.exponentialRampToValueAtTime(accented ? .20 : .13, at + .004);
      gain.gain.exponentialRampToValueAtTime(.0001, at + .075);
      oscillator.connect(gain);
      gain.connect(countInAudioContext.destination);
      oscillator.start(at);
      oscillator.stop(at + .08);
      countInOscillators.push(oscillator);
    }
    function cancelCountIn(resumePlayback = false) {
      if (!countInActive) return;
      countInActive = false;
      countInGeneration++;
      countInTimeouts.forEach(clearTimeout);
      countInTimeouts = [];
      countInOscillators.forEach(oscillator => { try { oscillator.stop(); } catch (_) {} });
      countInOscillators = [];
      const overlay = document.getElementById("countInOverlay");
      overlay.classList.remove("visible");
      overlay.textContent = "";
      if (resumePlayback && isPlayerReady()) { waitingForLoopSeek = true; player.seekTo(loopStart, true); player.playVideo(); }
    }
    function startLoopCountIn() {
      if (!isPlayerReady() || !isLoopEnabled || !isCountInEnabled) return;
      cancelCountIn();
      countInActive = true;
      const generation = ++countInGeneration;
      const beatMs = 60000 / effectiveBpm();
      const overlay = document.getElementById("countInOverlay");
      overlay.textContent = "Count-in";
      overlay.classList.add("visible");
      player.pauseVideo();
      player.seekTo(loopStart, true);
      if (countInAudioContext && countInAudioContext.state === "running") {
        const firstBeatAt = countInAudioContext.currentTime + .02;
        for (let beat = 0; beat < COUNT_IN_BEATS; beat++) scheduleCountInClick(firstBeatAt + beat * beatMs / 1000, beat === 0);
      }
      for (let beat = 0; beat < COUNT_IN_BEATS; beat++) {
        countInTimeouts.push(setTimeout(() => {
          if (countInActive && generation === countInGeneration) overlay.textContent = (beat + 1) + " / " + COUNT_IN_BEATS;
        }, beat * beatMs));
      }
      countInTimeouts.push(setTimeout(() => {
        if (!countInActive || generation !== countInGeneration) return;
        countInActive = false;
        countInTimeouts = [];
        countInOscillators = [];
        overlay.classList.remove("visible");
        overlay.textContent = "";
        waitingForLoopSeek = true;
        player.seekTo(loopStart, true);
        player.playVideo();
      }, COUNT_IN_BEATS * beatMs));
    }
    function changeBaseBpm() {
      baseBpm = normalizeBpm(document.getElementById("baseBpm").value);
      updateBpmControl();
      saveCountInSettings();
      if (countInActive) startLoopCountIn();
    }
    function toggleCountIn() {
      isCountInEnabled = document.getElementById("countInToggle").checked;
      if (isCountInEnabled) unlockCountInAudio();
      else cancelCountIn(true);
      saveCountInSettings();
      updateBpmControl();
      setMessage(isCountInEnabled ? "Count-in ON (" + COUNT_IN_BEATS + " beats)" : "Count-in OFF");
    }
    function restartLoopImmediately() {
      if (!isPlayerReady() || waitingForLoopSeek) return;
      waitingForLoopSeek = true;
      player.seekTo(loopStart, true);
      if (player.getPlayerState?.() !== YT.PlayerState.PLAYING) player.playVideo();
    }
    function formatTime(seconds) { const safe = Math.max(0, Math.floor(Number(seconds) || 0)); const h = Math.floor(safe / 3600); const m = Math.floor((safe % 3600) / 60); const s = safe % 60; return h > 0 ? h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0") : String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0"); }
    function formatPreciseTime(seconds) {
      const tenths = Math.max(0, Math.round((Number(seconds) || 0) * 10));
      const wholeSeconds = Math.floor(tenths / 10);
      const hours = Math.floor(wholeSeconds / 3600);
      const minutes = Math.floor((wholeSeconds % 3600) / 60);
      const secondsPart = String(wholeSeconds % 60).padStart(2, "0") + "." + (tenths % 10);
      return hours > 0 ? hours + ":" + String(minutes).padStart(2, "0") + ":" + secondsPart : String(minutes).padStart(2, "0") + ":" + secondsPart;
    }
    function clampTime(seconds) { const n = Number(seconds); if (!Number.isFinite(n)) return 0; return Math.min(videoDuration || 0, Math.max(0, n)); }
    function timeToPercent(seconds) { return videoDuration ? clampTime(seconds) / videoDuration * 100 : 0; }
    function getTimeFromPointer(event) { const rect = document.getElementById("timeTrack").getBoundingClientRect(); return Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width)) * (videoDuration || 0); }

    async function requestWakeLock() {
      if (document.visibilityState !== "visible" || !("wakeLock" in navigator) || wakeLockSentinel) return;
      try {
        wakeLockSentinel = await navigator.wakeLock.request("screen");
        wakeLockSentinel.addEventListener("release", () => { wakeLockSentinel = null; });
      } catch (_) { wakeLockSentinel = null; }
    }

    function updateHostToggle() { document.getElementById("hostToggle").checked = isNoCookieMode(); }
    function updateControlsToggle() { const enabled = isEmbedControlsEnabled(); document.getElementById("controlsToggle").checked = enabled; document.body.classList.toggle("controls-hidden", !enabled); }
    function updateFullscreenButton() { document.getElementById("fullscreenToggle").textContent = getFullscreenElement() ? "Exit" : "Full"; }
    function updateInvertButton() { document.getElementById("invertToggle").textContent = isInverted ? "Normal" : "Invert"; }
    function updateLoopButton() {
      document.getElementById("loopToggle").checked = isLoopEnabled;
      document.getElementById("loopSwitch").classList.toggle("is-on", isLoopEnabled);
      document.getElementById("loopStateLabel").textContent = isLoopEnabled ? "ON" : "OFF";
    }
    function updateSpeedButton() { document.getElementById("speed2Toggle").textContent = currentRate === SPEED_2 ? "x1" : "x2"; }

    function changeHostMode() { const url = new URL(location.href); url.searchParams.set(HOST_PARAM, document.getElementById("hostToggle").checked ? "nocookie" : "std"); location.href = url; }
    function changeControlsMode() { const url = new URL(location.href); url.searchParams.set(CONTROLS_PARAM, document.getElementById("controlsToggle").checked ? "on" : "off"); location.href = url; }

    function extractYouTubeVideoId(input) {
      if (!input) return null;
      const value = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(value)) return value;
      try {
        const url = new URL(value);
        const v = url.searchParams.get("v");
        if (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) return v;
        if (url.hostname.replace(/^www\./, "") === "youtu.be") return url.pathname.split("/").filter(Boolean)[0] || null;
        const parts = url.pathname.split("/").filter(Boolean);
        for (const marker of ["embed", "shorts", "live"]) { const i = parts.indexOf(marker); if (i !== -1 && /^[a-zA-Z0-9_-]{11}$/.test(parts[i + 1] || "")) return parts[i + 1]; }
      } catch (_) { return null; }
      return null;
    }

    function loadLoopRangeFromUrl() {
      if (hasLoadedLoopFromUrl || !videoDuration) return;
      const start = getNumberParam(LOOP_PARAM_START);
      const end = getNumberParam(LOOP_PARAM_END);
      if (start !== null || end !== null) {
        loopStart = clampTime(start !== null ? start : 0);
        loopEnd = clampTime(end !== null ? end : videoDuration);
        if (loopEnd <= loopStart) loopEnd = Math.min(videoDuration, loopStart + LOOP_GAP_SECONDS);
      }
      hasLoadedLoopFromUrl = true;
    }

    function updateLoopParamsInUrl() { if (!videoDuration) return; const url = new URL(location.href); url.searchParams.set(LOOP_PARAM_START, loopStart.toFixed(2)); url.searchParams.set(LOOP_PARAM_END, (loopEnd || videoDuration).toFixed(2)); history.replaceState(null, "", url); }
    function updateVideoTitle(attempt = 0) { if (!player || typeof player.getVideoData !== "function") return; const title = (player.getVideoData()?.title || "").trim(); if (title) document.title = title; else if (attempt < 10) setTimeout(() => updateVideoTitle(attempt + 1), 500); }

    function updateSpeedControl() {
      const rate = normalizeRate(currentRate);
      document.getElementById("speedStepValue").textContent = formatRate(rate);
      document.querySelectorAll(".speed-preset").forEach(button => button.classList.toggle("active", normalizeRate(button.dataset.rate) === rate));
      updateBpmControl();
    }

    function setVolumeFromRange() { if (!player?.setVolume) return; const volume = Math.min(100, Math.max(0, Number(document.getElementById("volumeRange").value) || 0)); player.setVolume(volume); volume ? player.unMute?.() : player.mute?.(); setMessage("Vol <code>" + volume + "%</code>"); }

    function renderLoopSelection() {
      // Update the highlighted A-B segment independently of YouTube playback updates.
      const start = timeToPercent(loopStart);
      const end = timeToPercent(loopEnd || videoDuration);
      const range = document.getElementById("loopRange");
      range.style.left = start + "%";
      range.style.width = Math.max(0, end - start) + "%";
      document.getElementById("loopStartHandle").style.left = start + "%";
      document.getElementById("loopEndHandle").style.left = end + "%";
      document.getElementById("loopValue").textContent = formatPreciseTime(loopStart) + " - " + formatPreciseTime(loopEnd || videoDuration);
      document.getElementById("loopStartValue").textContent = formatPreciseTime(loopStart);
      document.getElementById("loopEndValue").textContent = formatPreciseTime(loopEnd || videoDuration);
    }

    function updateTimeControl() {
      if (!isPlayerReady()) return;
      const duration = Number(player.getDuration?.()) || 0;
      if (duration > 0) { const old = videoDuration; videoDuration = duration; if (!old || !loopEnd) { loopStart = 0; loopEnd = duration; } loadLoopRangeFromUrl(); }
      const currentTime = clampTime(player.getCurrentTime());
      renderLoopSelection();
      if (waitingForLoopSeek && currentTime < loopEnd - Math.min(.1, (loopEnd - loopStart) / 2)) waitingForLoopSeek = false;
      const playerState = player.getPlayerState?.();
      if (isLoopEnabled && !countInActive && !waitingForLoopSeek && !activeLoopHandle && !isDraggingSeek &&
          loopEnd > loopStart && currentTime >= loopEnd &&
          (playerState === YT.PlayerState.PLAYING || playerState === YT.PlayerState.ENDED)) {
        if (isCountInEnabled) startLoopCountIn();
        else restartLoopImmediately();
        return;
      }
      document.getElementById("timeValue").textContent = formatTime(currentTime) + " / " + formatTime(videoDuration);
      document.getElementById("timeProgress").style.width = timeToPercent(currentTime) + "%";
      updateLoopButton();
    }

    function setPlaybackRate(rate) { if (!player?.setPlaybackRate) return; const oldRate = currentRate; currentRate = normalizeRate(rate); player.setPlaybackRate(currentRate); updateSpeedButton(); updateSpeedControl(); if (countInActive && oldRate !== currentRate) startLoopCountIn(); setMessage("Speed <code>" + formatRate(currentRate) + "</code>"); }
    function updatePlaybackButton() {
      const button = document.getElementById("playerToggle");
      if (!button || !isPlayerReady()) return;
      const playing = player.getPlayerState?.() === YT.PlayerState.PLAYING;
      button.textContent = playing ? "Pause" : "Play";
      button.setAttribute("aria-label", playing ? "一時停止" : "再生");
    }
    function togglePlayback() {
      if (!isPlayerReady()) return;
      requestWakeLock();
      if (countInActive) { cancelCountIn(); player.playVideo(); }
      else if (player.getPlayerState?.() === YT.PlayerState.PLAYING) player.pauseVideo();
      else player.playVideo();
      updatePlaybackButton();
    }
    function toggleSpeed2() { if (!isPlayerReady()) return; requestWakeLock(); if (!countInActive) player.playVideo(); setPlaybackRate(currentRate === SPEED_2 ? NORMAL_RATE : SPEED_2); }
    function seekToTime(seconds) { if (!isPlayerReady() || !videoDuration) return; const wasCounting = countInActive; cancelCountIn(); waitingForLoopSeek = false; player.seekTo(clampTime(seconds), true); if (wasCounting) player.playVideo(); updateTimeControl(); }
    function seekBy(seconds) { if (isPlayerReady()) seekToTime(player.getCurrentTime() + seconds); }
    function seekLoopStart() { if (!isPlayerReady() || !videoDuration) return; seekToTime(loopStart); setMessage("Back A <code>" + formatTime(loopStart) + "</code>"); }

    function isKeyboardShortcutTarget(target) {
      if (!(target instanceof Element)) return false;
      return ["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(target.tagName) || target.isContentEditable;
    }

    function handleKeyboardShortcut(event) {
      if (event.repeat || isKeyboardShortcutTarget(event.target) || !isPlayerReady()) return;
      if (event.code === "Space") {
        event.preventDefault();
        togglePlayback();
      } else if (event.code === "ArrowLeft") {
        event.preventDefault();
        seekBy(-SKIP_10_SECONDS);
      } else if (event.code === "ArrowRight") {
        event.preventDefault();
        seekBy(SKIP_10_SECONDS);
      }
    }

    function setLoopPoint(handle, seconds, seek = true, persist = true) {
      if (!videoDuration) return;
      if (countInActive) cancelCountIn(true);
      const next = clampTime(seconds);
      if (handle === "start") loopStart = Math.min(next, Math.max(0, loopEnd - LOOP_GAP_SECONDS));
      else if (handle === "end") loopEnd = Math.max(next, Math.min(videoDuration, loopStart + LOOP_GAP_SECONDS));
      // Dragging must move the A/B handles and highlighted bar in the same frame.
      renderLoopSelection();
      if (persist) updateLoopParamsInUrl();
      if (seek) seekToTime(handle === "start" ? loopStart : loopEnd);
    }
    function nudgeLoopPoint(handle, delta) {
      if (!isPlayerReady() || !videoDuration) return;
      const time = (handle === "start" ? loopStart : loopEnd) + delta;
      setLoopPoint(handle, Math.round(time * 10) / 10, false);
      setMessage((handle === "start" ? "A" : "B") + " <code>" + formatPreciseTime(handle === "start" ? loopStart : loopEnd) + "</code>");
    }
    function handleLoopHandleKeyDown(event) {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const handle = event.currentTarget.id === "loopStartHandle" ? "start" : "end";
      nudgeLoopPoint(handle, (event.shiftKey ? 1 : .1) * (event.key === "ArrowLeft" ? -1 : 1));
    }

    function setLoopStartAtCurrentTime() { if (!isPlayerReady() || !videoDuration) return; if (countInActive) cancelCountIn(true); loopStart = clampTime(player.getCurrentTime()); if (loopEnd <= loopStart) loopEnd = Math.min(videoDuration, loopStart + LOOP_GAP_SECONDS); updateLoopParamsInUrl(); updateTimeControl(); setMessage("A <code>" + formatTime(loopStart) + "</code>"); }
    function setLoopEndAtCurrentTime() { if (!isPlayerReady() || !videoDuration) return; if (countInActive) cancelCountIn(true); loopEnd = clampTime(player.getCurrentTime()); if (loopEnd <= loopStart) loopStart = Math.max(0, loopEnd - LOOP_GAP_SECONDS); updateLoopParamsInUrl(); updateTimeControl(); setMessage("B <code>" + formatTime(loopEnd) + "</code>"); }
    function toggleLoop() { isLoopEnabled = document.getElementById("loopToggle").checked; if (isLoopEnabled) unlockCountInAudio(); else { cancelCountIn(true); waitingForLoopSeek = false; } updateLoopButton(); setMessage(isLoopEnabled ? "Loop ON" : "Loop OFF"); }
    function resetLoopRange() { if (countInActive) cancelCountIn(true); waitingForLoopSeek = false; loopStart = 0; loopEnd = videoDuration || 0; updateLoopParamsInUrl(); updateTimeControl(); setMessage("Reset loop"); }

    function toggleFullscreen() { const wrap = document.getElementById("playerWrap"); if (getFullscreenElement()) { (document.exitFullscreen || document.webkitExitFullscreen)?.call(document); return; } (wrap.requestFullscreen || wrap.webkitRequestFullscreen || wrap.webkitEnterFullscreen)?.call(wrap); }
    function toggleInvert() { isInverted = !isInverted; document.getElementById("playerWrap").classList.toggle("inverted", isInverted); updateInvertButton(); setMessage(isInverted ? "Invert ON" : "Invert OFF"); }

    function handleTrackPointerDown(event) {
      if (!videoDuration || activePointerId !== null) return;
      requestWakeLock();
      const targetId = event.target.closest?.(".loop-handle")?.id || event.target.id;
      if (targetId === "loopStartHandle") activeLoopHandle = "start";
      else if (targetId === "loopEndHandle") activeLoopHandle = "end";
      else isDraggingSeek = true;
      activePointerId = event.pointerId;
      if (isDraggingSeek) seekToTime(getTimeFromPointer(event));
      // Track capture keeps the drag alive if the finger passes outside the A/B button.
      try { event.currentTarget.setPointerCapture?.(event.pointerId); } catch (_) {}
      event.preventDefault();
    }
    function handleTrackPointerMove(event) {
      if (activePointerId === null || event.pointerId !== activePointerId) return;
      if (activeLoopHandle) {
        setLoopPoint(activeLoopHandle, getTimeFromPointer(event), false, false);
      } else if (isDraggingSeek) {
        seekToTime(getTimeFromPointer(event));
      }
    }
    function handleTrackPointerUp(event) {
      if (activePointerId === null || event.pointerId !== activePointerId) return;
      const handle = activeLoopHandle;
      const isCancel = event.type === "pointercancel";
      if (handle && !isCancel && Number.isFinite(event.clientX)) {
        setLoopPoint(handle, getTimeFromPointer(event), false, false);
      }
      activePointerId = null;
      activeLoopHandle = null;
      isDraggingSeek = false;
      if (handle) {
        updateLoopParamsInUrl();
        if (!isCancel) seekToTime(handle === "start" ? loopStart : loopEnd);
        else updateTimeControl();
      } else updateTimeControl();
    }

    function copyBookmarklet() { const code = document.getElementById("bookmarkletCode"); const button = document.getElementById("copyBookmarklet"); const done = () => { button.textContent = "Copied"; setTimeout(() => button.textContent = "Copy", 1600); }; if (navigator.clipboard && isSecureContext) navigator.clipboard.writeText(BOOKMARKLET_CODE).then(done).catch(() => { code.select(); document.execCommand("copy"); done(); }); else { code.select(); document.execCommand("copy"); done(); } }

    function onYouTubeIframeAPIReady() {
      const videoId = extractYouTubeVideoId(getParam("url") || getParam("v"));
      if (!videoId) { setMessage("Add a YouTube video ID in the URL<br>Example: <code>?v=videoId</code>"); return; }
      player = new YT.Player("player", {
        width: "100%", height: "100%", videoId, host: getYouTubeHost(),
        playerVars: { playsinline: 1, rel: 0, controls: getEmbedControlsValue(), disablekb: 1, fs: 0, iv_load_policy: 3, cc_load_policy: 0, modestbranding: 1 },
        events: {
          onReady() { applyInitialCaptionsOff(); setPlaybackRate(NORMAL_RATE); player.setVolume?.(Number(document.getElementById("volumeRange").value)); updatePlaybackButton(); updateSpeedButton(); updateSpeedControl(); updateInvertButton(); updateFullscreenButton(); updateHostToggle(); updateControlsToggle(); updateTimeControl(); updateVideoTitle(); setInterval(updateTimeControl, 250); setMessage("Ready"); },
          onStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
              if (countInActive) player.pauseVideo();
              else requestWakeLock();
            } else if (event.data === YT.PlayerState.ENDED && isLoopEnabled && !countInActive && !waitingForLoopSeek && loopEnd > loopStart) {
              if (isCountInEnabled) startLoopCountIn();
              else restartLoopImmediately();
            }
            updatePlaybackButton();
          },
          onPlaybackRateChange(event) { const oldRate = currentRate; currentRate = normalizeRate(event.data); updateSpeedButton(); updateSpeedControl(); if (countInActive && oldRate !== currentRate) startLoopCountIn(); },
          onApiChange() { applyInitialCaptionsOff(); }
        }
      });
    }

    document.getElementById("playerToggle").addEventListener("click", togglePlayback);
    document.getElementById("speed2Toggle").addEventListener("click", toggleSpeed2);
    document.getElementById("speedDown").addEventListener("click", () => setPlaybackRate(currentRate - RATE_STEP));
    document.getElementById("speedUp").addEventListener("click", () => setPlaybackRate(currentRate + RATE_STEP));
    document.querySelectorAll(".speed-preset").forEach(button => button.addEventListener("click", () => setPlaybackRate(button.dataset.rate)));
    document.getElementById("volumeRange").addEventListener("input", setVolumeFromRange);
    document.getElementById("hostToggle").addEventListener("change", changeHostMode);
    document.getElementById("controlsToggle").addEventListener("change", changeControlsMode);
    document.getElementById("fullscreenToggle").addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") requestWakeLock(); });
    document.addEventListener("keydown", handleKeyboardShortcut);
    document.addEventListener("pointerdown", requestWakeLock, { once: true });
    document.addEventListener("pointerdown", unlockCountInAudio, { once: true });
    document.addEventListener("touchstart", requestWakeLock, { once: true, passive: true });
    document.addEventListener("touchstart", unlockCountInAudio, { once: true, passive: true });

    const loopTrack = document.getElementById("timeTrack");
    loopTrack.addEventListener("pointerdown", handleTrackPointerDown);
    // Listen on document so dragging continues reliably even outside the track.
    document.addEventListener("pointermove", handleTrackPointerMove);
    document.addEventListener("pointerup", handleTrackPointerUp);
    document.addEventListener("pointercancel", handleTrackPointerUp);
    ["loopStartHandle", "loopEndHandle"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", handleLoopHandleKeyDown);
    });

    document.getElementById("loopToggle").addEventListener("change", toggleLoop);
    document.getElementById("countInToggle").addEventListener("change", toggleCountIn);
    document.getElementById("baseBpm").addEventListener("change", changeBaseBpm);
    document.getElementById("loopSetStart").addEventListener("click", setLoopStartAtCurrentTime);
    document.getElementById("loopSetEnd").addEventListener("click", setLoopEndAtCurrentTime);
    document.getElementById("loopStartMinus").addEventListener("click", () => nudgeLoopPoint("start", -.1));
    document.getElementById("loopStartPlus").addEventListener("click", () => nudgeLoopPoint("start", .1));
    document.getElementById("loopEndMinus").addEventListener("click", () => nudgeLoopPoint("end", -.1));
    document.getElementById("loopEndPlus").addEventListener("click", () => nudgeLoopPoint("end", .1));
    document.getElementById("loopBackStart").addEventListener("click", seekLoopStart);
    document.getElementById("loopReset").addEventListener("click", resetLoopRange);
    document.getElementById("skipForward90").addEventListener("click", () => seekBy(SKIP_90_SECONDS));
    document.getElementById("skipBack10").addEventListener("click", () => seekBy(-SKIP_10_SECONDS));
    document.getElementById("skipForward10").addEventListener("click", () => seekBy(SKIP_10_SECONDS));
    document.getElementById("invertToggle").addEventListener("click", toggleInvert);
    document.getElementById("copyBookmarklet").addEventListener("click", copyBookmarklet);

    loadCountInSettings();
    updateSpeedButton(); updateSpeedControl(); updateInvertButton(); updateFullscreenButton(); updateLoopButton(); updateHostToggle(); updateControlsToggle();
    const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
  </script>
</body>
</html>
