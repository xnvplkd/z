<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>▶️</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111; color: #fff; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    .player-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
    body.controls-hidden .player-wrap { aspect-ratio: 1 / 0.85; }
    .player-wrap.inverted { filter: invert(1); }
    .player-wrap:fullscreen, .player-wrap:-webkit-full-screen { border-radius: 0; }
    #player { width: 100%; height: 100%; }
    .message { margin-top: 16px; line-height: 1.7; color: #ddd; word-break: break-all; }
    .controls { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .range-pill, .host-switch, .embed-switch, .loop-switch { display: inline-flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 999px; background: #222; font-size: 14px; font-weight: 700; user-select: none; }
    .range-pill input[type="range"] { width: 110px; }
    .host-switch, .embed-switch, .loop-switch { cursor: pointer; }
    .host-switch input, .embed-switch input, .loop-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch-slider { position: relative; width: 38px; height: 22px; border-radius: 999px; background: #555; }
    .switch-slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: transform .16s ease; }
    .host-switch input:checked + .switch-slider, .embed-switch input:checked + .switch-slider, .loop-switch input:checked + .switch-slider { background: #fff; }
    .host-switch input:checked + .switch-slider::before, .embed-switch input:checked + .switch-slider::before, .loop-switch input:checked + .switch-slider::before { transform: translateX(16px); background: #111; }
    .speed-control, .time-control { margin-top: 16px; padding: 14px; border: 1px solid #333; border-radius: 12px; background: #181818; }
    .speed-control label, .time-label-row { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; margin-bottom: 10px; }
    .speed-control input[type="range"] { width: 100%; }
    .speed-presets, .speed-stepper { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .speed-presets button, .speed-stepper button { min-width: 54px; padding: 9px 12px; }
    .speed-preset.active { background: #ddd; }
    .speed-current { min-width: 72px; text-align: center; font-weight: 800; }
    .speed-range-meta, .loop-meta { display: flex; justify-content: space-between; margin-top: 6px; color: #aaa; font-size: 12px; }
    .time-track { position: relative; height: 40px; margin: 10px 8px 0; cursor: pointer; touch-action: none; }
    .time-track::before { content: ""; position: absolute; left: 0; right: 0; top: 16px; height: 8px; border-radius: 999px; background: #333; }
    .time-progress, .loop-range { position: absolute; top: 16px; height: 8px; border-radius: 999px; pointer-events: none; }
    .time-progress { left: 0; width: 0%; background: #777; }
    .loop-range { left: 0%; width: 100%; background: rgba(255,255,255,.32); }
    .loop-handle { position: absolute; top: 0; transform: translateX(-50%); min-width: 36px; padding: 5px 9px; border-radius: 999px; font-size: 12px; z-index: 2; user-select: none; touch-action: none; }
    .loop-start { left: 0%; }
    .loop-end { left: 100%; }
    .loop-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .bookmarklet-section { margin-top: 40px; padding-top: 24px; border-top: 1px solid #333; }
    .bookmarklet-section h2 { margin: 0 0 12px; font-size: 18px; }
    .bookmarklet-code { display: block; box-sizing: border-box; width: 100%; min-height: 96px; margin-top: 16px; padding: 12px; border: 1px solid #333; border-radius: 10px; background: #222; color: #fff; font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; resize: vertical; word-break: break-all; }
    .bookmarklet-copy-row { margin-top: 12px; }
    button, .bookmarklet-button { appearance: none; border: 0; border-radius: 999px; padding: 10px 16px; font-size: 14px; cursor: pointer; background: #fff; color: #111; font-weight: 700; }
    code { background: #222; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="player-wrap" id="playerWrap"><div id="player"></div></div>

    <div class="controls">
      <button type="button" id="speed2Toggle">x2</button>
      <button type="button" id="skipForward90">+90</button>
      <button type="button" id="skipBack10">-10</button>
      <button type="button" id="skipForward10">+10</button>
      <button type="button" id="invertToggle">Invert</button>
      <button type="button" id="fullscreenToggle">Full</button>
      <label class="range-pill" for="volumeRange"><span>Vol</span><input type="range" id="volumeRange" min="0" max="100" step="1" value="50"></label>
      <label class="host-switch"><span>Std</span><input type="checkbox" id="hostToggle"><span class="switch-slider" aria-hidden="true"></span><span>NoCookie</span></label>
      <label class="embed-switch"><span>Ctrl</span><input type="checkbox" id="controlsToggle"><span class="switch-slider" aria-hidden="true"></span></label>
    </div>

    <div class="time-control">
      <div class="time-label-row"><span>Time</span><span id="timeValue">00:00 / 00:00</span></div>
      <div class="time-track" id="timeTrack" aria-label="Playback position and loop range">
        <div class="time-progress" id="timeProgress"></div>
        <div class="loop-range" id="loopRange"></div>
        <button type="button" class="loop-handle loop-start" id="loopStartHandle">A</button>
        <button type="button" class="loop-handle loop-end" id="loopEndHandle">B</button>
      </div>
      <div class="loop-meta"><span>Loop</span><span id="loopValue">00:00 - 00:00</span></div>
      <div class="loop-actions">
        <label class="loop-switch"><span>Loop</span><input type="checkbox" id="loopToggle"><span class="switch-slider" aria-hidden="true"></span></label>
        <button type="button" id="loopSetStart">Set A</button>
        <button type="button" id="loopSetEnd">Set B</button>
        <button type="button" id="loopBackStart">Back A</button>
        <button type="button" id="loopReset">Reset</button>
      </div>
    </div>

    <div class="speed-control">
      <label for="speedRange"><span>Speed</span><span id="speedValue">1.00x</span></label>
      <div class="speed-presets">
        <button type="button" class="speed-preset" data-rate="0.5">0.5</button>
        <button type="button" class="speed-preset" data-rate="0.75">0.75</button>
        <button type="button" class="speed-preset" data-rate="1">1x</button>
        <button type="button" class="speed-preset" data-rate="1.25">1.25</button>
        <button type="button" class="speed-preset" data-rate="1.5">1.5</button>
        <button type="button" class="speed-preset" data-rate="2">2x</button>
      </div>
      <div class="speed-stepper">
        <button type="button" id="speedDown">-</button>
        <span class="speed-current" id="speedStepValue">1.00x</span>
        <button type="button" id="speedUp">+</button>
      </div>
      <input type="range" id="speedRange" min="0.25" max="2" step="0.05" value="1">
      <div class="speed-range-meta"><span>0.25x</span><span>2.00x</span></div>
    </div>

    <div class="message" id="message"></div>

    <section class="bookmarklet-section">
      <h2>Bookmarklet</h2>
      <textarea class="bookmarklet-code" id="bookmarkletCode" readonly>javascript:(()=>{const id=new URL(location.href).searchParams.get("v");if(!id){document.title="動画IDが見つかりません";return;}location.href="https://xnvplkd.github.io/z/?v="+encodeURIComponent(id);})();</textarea>
      <div class="bookmarklet-copy-row"><button type="button" id="copyBookmarklet">Copy</button></div>
    </section>
  </main>

  <script>
    const NORMAL_RATE = 1;
    const SPEED_2 = 2;
    const MIN_RATE = .25;
    const MAX_RATE = 2;
    const RATE_STEP = .05;
    const SKIP_10_SECONDS = 10;
    const SKIP_90_SECONDS = 90;
    const LOOP_GAP_SECONDS = .5;
    const LOOP_PARAM_START = "loopStart";
    const LOOP_PARAM_END = "loopEnd";
    const HOST_PARAM = "host";
    const CONTROLS_PARAM = "controls";
    const YOUTUBE_STANDARD_HOST = "https://www.youtube.com";
    const YOUTUBE_NOCOOKIE_HOST = "https://www.youtube-nocookie.com";
    const BOOKMARKLET_CODE = 'javascript:(()=>{const id=new URL(location.href).searchParams.get("v");if(!id){document.title="動画IDが見つかりません";return;}location.href="https://xnvplkd.github.io/z/?v="+encodeURIComponent(id);})();';

    let player = null;
    let currentRate = NORMAL_RATE;
    let isInverted = false;
    let videoDuration = 0;
    let loopStart = 0;
    let loopEnd = 0;
    let isLoopEnabled = false;
    let activeLoopHandle = null;
    let isDraggingSeek = false;
    let hasLoadedLoopFromUrl = false;
    let wakeLockSentinel = null;

    function getParam(name) { return new URLSearchParams(location.search).get(name); }
    function getNumberParam(name) { const value = getParam(name); if (value === null || value === "") return null; const number = Number(value); return Number.isFinite(number) ? number : null; }
    function isNoCookieMode() { return getParam(HOST_PARAM) === "nocookie"; }
    function getYouTubeHost() { return isNoCookieMode() ? YOUTUBE_NOCOOKIE_HOST : YOUTUBE_STANDARD_HOST; }
    function isEmbedControlsEnabled() { return getParam(CONTROLS_PARAM) === "on"; }
    function getEmbedControlsValue() { return isEmbedControlsEnabled() ? 1 : 0; }
    function getFullscreenElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
    function setMessage(text) { document.getElementById("message").innerHTML = text; }
    function isPlayerReady() { return player && typeof player.getCurrentTime === "function"; }
    function formatRate(rate) { return Number(rate).toFixed(2) + "x"; }
    function normalizeRate(rate) { const n = Number(rate); if (!Number.isFinite(n)) return NORMAL_RATE; return Math.round(Math.min(MAX_RATE, Math.max(MIN_RATE, n)) / RATE_STEP) * RATE_STEP; }
    function formatTime(seconds) { const safe = Math.max(0, Math.floor(Number(seconds) || 0)); const h = Math.floor(safe / 3600); const m = Math.floor((safe % 3600) / 60); const s = safe % 60; return h > 0 ? h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0") : String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0"); }
    function clampTime(seconds) { const n = Number(seconds); if (!Number.isFinite(n)) return 0; return Math.min(videoDuration || 0, Math.max(0, n)); }
    function timeToPercent(seconds) { return videoDuration ? clampTime(seconds) / videoDuration * 100 : 0; }
    function getTimeFromPointer(event) { const rect = document.getElementById("timeTrack").getBoundingClientRect(); return Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width)) * (videoDuration || 0); }

    async function requestWakeLock() {
      if (document.visibilityState !== "visible" || !("wakeLock" in navigator) || wakeLockSentinel) return;
      try {
        wakeLockSentinel = await navigator.wakeLock.request("screen");
        wakeLockSentinel.addEventListener("release", () => { wakeLockSentinel = null; });
      } catch (_) { wakeLockSentinel = null; }
    }

    function updateHostToggle() { document.getElementById("hostToggle").checked = isNoCookieMode(); }
    function updateControlsToggle() { const enabled = isEmbedControlsEnabled(); document.getElementById("controlsToggle").checked = enabled; document.body.classList.toggle("controls-hidden", !enabled); }
    function updateFullscreenButton() { document.getElementById("fullscreenToggle").textContent = getFullscreenElement() ? "Exit" : "Full"; }
    function updateInvertButton() { document.getElementById("invertToggle").textContent = isInverted ? "Normal" : "Invert"; }
    function updateLoopButton() { document.getElementById("loopToggle").checked = isLoopEnabled; }
    function updateSpeedButton() { document.getElementById("speed2Toggle").textContent = currentRate === SPEED_2 ? "x1" : "x2"; }

    function changeHostMode() { const url = new URL(location.href); url.searchParams.set(HOST_PARAM, document.getElementById("hostToggle").checked ? "nocookie" : "std"); location.href = url; }
    function changeControlsMode() { const url = new URL(location.href); url.searchParams.set(CONTROLS_PARAM, document.getElementById("controlsToggle").checked ? "on" : "off"); location.href = url; }

    function extractYouTubeVideoId(input) {
      if (!input) return null;
      const value = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(value)) return value;
      try {
        const url = new URL(value);
        const v = url.searchParams.get("v");
        if (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) return v;
        if (url.hostname.replace(/^www\./, "") === "youtu.be") return url.pathname.split("/").filter(Boolean)[0] || null;
        const parts = url.pathname.split("/").filter(Boolean);
        for (const marker of ["embed", "shorts", "live"]) { const i = parts.indexOf(marker); if (i !== -1 && /^[a-zA-Z0-9_-]{11}$/.test(parts[i + 1] || "")) return parts[i + 1]; }
      } catch (_) { return null; }
      return null;
    }

    function loadLoopRangeFromUrl() {
      if (hasLoadedLoopFromUrl || !videoDuration) return;
      const start = getNumberParam(LOOP_PARAM_START);
      const end = getNumberParam(LOOP_PARAM_END);
      if (start !== null || end !== null) {
        loopStart = clampTime(start !== null ? start : 0);
        loopEnd = clampTime(end !== null ? end : videoDuration);
        if (loopEnd <= loopStart) loopEnd = Math.min(videoDuration, loopStart + LOOP_GAP_SECONDS);
      }
      hasLoadedLoopFromUrl = true;
    }

    function updateLoopParamsInUrl() { if (!videoDuration) return; const url = new URL(location.href); url.searchParams.set(LOOP_PARAM_START, loopStart.toFixed(2)); url.searchParams.set(LOOP_PARAM_END, (loopEnd || videoDuration).toFixed(2)); history.replaceState(null, "", url); }
    function updateVideoTitle(attempt = 0) { if (!player || typeof player.getVideoData !== "function") return; const title = (player.getVideoData()?.title || "").trim(); if (title) document.title = title; else if (attempt < 10) setTimeout(() => updateVideoTitle(attempt + 1), 500); }

    function updateSpeedControl() {
      const rate = normalizeRate(currentRate);
      document.getElementById("speedRange").value = String(rate);
      document.getElementById("speedValue").textContent = formatRate(rate);
      document.getElementById("speedStepValue").textContent = formatRate(rate);
      document.querySelectorAll(".speed-preset").forEach(button => button.classList.toggle("active", normalizeRate(button.dataset.rate) === rate));
    }

    function setVolumeFromRange() { if (!player?.setVolume) return; const volume = Math.min(100, Math.max(0, Number(document.getElementById("volumeRange").value) || 0)); player.setVolume(volume); volume ? player.unMute?.() : player.mute?.(); setMessage("Vol <code>" + volume + "%</code>"); }

    function updateTimeControl() {
      if (!isPlayerReady()) return;
      const duration = Number(player.getDuration?.()) || 0;
      if (duration > 0) { const old = videoDuration; videoDuration = duration; if (!old || !loopEnd) { loopStart = 0; loopEnd = duration; } loadLoopRangeFromUrl(); }
      const currentTime = clampTime(player.getCurrentTime());
      if (isLoopEnabled && !activeLoopHandle && loopEnd > loopStart && currentTime >= loopEnd) { player.seekTo(loopStart, true); return; }
      document.getElementById("timeValue").textContent = formatTime(currentTime) + " / " + formatTime(videoDuration);
      document.getElementById("timeProgress").style.width = timeToPercent(currentTime) + "%";
      document.getElementById("loopStartHandle").style.left = timeToPercent(loopStart) + "%";
      document.getElementById("loopEndHandle").style.left = timeToPercent(loopEnd || videoDuration) + "%";
      document.getElementById("loopRange").style.left = timeToPercent(loopStart) + "%";
      document.getElementById("loopRange").style.width = Math.max(0, timeToPercent(loopEnd || videoDuration) - timeToPercent(loopStart)) + "%";
      document.getElementById("loopValue").textContent = formatTime(loopStart) + " - " + formatTime(loopEnd || videoDuration);
      updateLoopButton();
    }

    function setPlaybackRate(rate) { if (!player?.setPlaybackRate) return; currentRate = normalizeRate(rate); player.setPlaybackRate(currentRate); updateSpeedButton(); updateSpeedControl(); setMessage("Speed <code>" + formatRate(currentRate) + "</code>"); }
    function toggleSpeed2() { if (!isPlayerReady()) return; requestWakeLock(); player.playVideo(); setPlaybackRate(currentRate === SPEED_2 ? NORMAL_RATE : SPEED_2); }
    function seekToTime(seconds) { if (!isPlayerReady() || !videoDuration) return; player.seekTo(clampTime(seconds), true); updateTimeControl(); }
    function seekBy(seconds) { if (isPlayerReady()) seekToTime(player.getCurrentTime() + seconds); }
    function seekLoopStart() { if (!isPlayerReady() || !videoDuration) return; seekToTime(loopStart); setMessage("Back A <code>" + formatTime(loopStart) + "</code>"); }

    function isKeyboardShortcutTarget(target) {
      if (!(target instanceof Element)) return false;
      return ["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(target.tagName) || target.isContentEditable;
    }

    function handleKeyboardShortcut(event) {
      if (event.repeat || isKeyboardShortcutTarget(event.target) || !isPlayerReady()) return;
      if (event.code === "Space") {
        event.preventDefault();
        requestWakeLock();
        if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo();
      } else if (event.code === "ArrowLeft") {
        event.preventDefault();
        seekBy(-SKIP_10_SECONDS);
      } else if (event.code === "ArrowRight") {
        event.preventDefault();
        seekBy(SKIP_10_SECONDS);
      }
    }

    function setLoopPoint(handle, seconds) {
      if (!videoDuration) return;
      const next = clampTime(seconds);
      if (handle === "start") loopStart = Math.min(next, Math.max(0, loopEnd - LOOP_GAP_SECONDS));
      else if (handle === "end") loopEnd = Math.max(next, Math.min(videoDuration, loopStart + LOOP_GAP_SECONDS));
      updateLoopParamsInUrl();
      seekToTime(handle === "start" ? loopStart : loopEnd);
    }

    function setLoopStartAtCurrentTime() { if (!isPlayerReady() || !videoDuration) return; loopStart = clampTime(player.getCurrentTime()); if (loopEnd <= loopStart) loopEnd = Math.min(videoDuration, loopStart + LOOP_GAP_SECONDS); updateLoopParamsInUrl(); updateTimeControl(); setMessage("A <code>" + formatTime(loopStart) + "</code>"); }
    function setLoopEndAtCurrentTime() { if (!isPlayerReady() || !videoDuration) return; loopEnd = clampTime(player.getCurrentTime()); if (loopEnd <= loopStart) loopStart = Math.max(0, loopEnd - LOOP_GAP_SECONDS); updateLoopParamsInUrl(); updateTimeControl(); setMessage("B <code>" + formatTime(loopEnd) + "</code>"); }
    function toggleLoop() { isLoopEnabled = document.getElementById("loopToggle").checked; setMessage(isLoopEnabled ? "Loop ON" : "Loop OFF"); }
    function resetLoopRange() { loopStart = 0; loopEnd = videoDuration || 0; updateLoopParamsInUrl(); updateTimeControl(); setMessage("Reset loop"); }

    function toggleFullscreen() { const wrap = document.getElementById("playerWrap"); if (getFullscreenElement()) { (document.exitFullscreen || document.webkitExitFullscreen)?.call(document); return; } (wrap.requestFullscreen || wrap.webkitRequestFullscreen || wrap.webkitEnterFullscreen)?.call(wrap); }
    function toggleInvert() { isInverted = !isInverted; document.getElementById("playerWrap").classList.toggle("inverted", isInverted); updateInvertButton(); setMessage(isInverted ? "Invert ON" : "Invert OFF"); }

    function handleTrackPointerDown(event) { if (!videoDuration) return; requestWakeLock(); if (event.target.id === "loopStartHandle") activeLoopHandle = "start"; else if (event.target.id === "loopEndHandle") activeLoopHandle = "end"; else { isDraggingSeek = true; seekToTime(getTimeFromPointer(event)); } event.currentTarget.setPointerCapture?.(event.pointerId); event.preventDefault(); }
    function handleTrackPointerMove(event) { if (activeLoopHandle) setLoopPoint(activeLoopHandle, getTimeFromPointer(event)); else if (isDraggingSeek) seekToTime(getTimeFromPointer(event)); }
    function handleTrackPointerUp() { activeLoopHandle = null; isDraggingSeek = false; updateTimeControl(); }

    function copyBookmarklet() { const code = document.getElementById("bookmarkletCode"); const button = document.getElementById("copyBookmarklet"); const done = () => { button.textContent = "Copied"; setTimeout(() => button.textContent = "Copy", 1600); }; if (navigator.clipboard && isSecureContext) navigator.clipboard.writeText(BOOKMARKLET_CODE).then(done).catch(() => { code.select(); document.execCommand("copy"); done(); }); else { code.select(); document.execCommand("copy"); done(); } }

    function onYouTubeIframeAPIReady() {
      const videoId = extractYouTubeVideoId(getParam("url") || getParam("v"));
      if (!videoId) { setMessage("Add a YouTube video ID in the URL<br>Example: <code>?v=videoId</code>"); return; }
      player = new YT.Player("player", {
        width: "100%", height: "100%", videoId, host: getYouTubeHost(),
        playerVars: { playsinline: 1, rel: 0, controls: getEmbedControlsValue(), disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1 },
        events: {
          onReady() { setPlaybackRate(NORMAL_RATE); player.setVolume?.(Number(document.getElementById("volumeRange").value)); updateSpeedButton(); updateSpeedControl(); updateInvertButton(); updateFullscreenButton(); updateHostToggle(); updateControlsToggle(); updateTimeControl(); updateVideoTitle(); setInterval(updateTimeControl, 250); setMessage("Ready"); },
          onStateChange(event) { if (event.data === YT.PlayerState.PLAYING) requestWakeLock(); },
          onPlaybackRateChange(event) { currentRate = normalizeRate(event.data); updateSpeedButton(); updateSpeedControl(); }
        }
      });
    }

    document.getElementById("speed2Toggle").addEventListener("click", toggleSpeed2);
    document.getElementById("speedRange").addEventListener("input", e => setPlaybackRate(e.currentTarget.value));
    document.getElementById("speedDown").addEventListener("click", () => setPlaybackRate(currentRate - RATE_STEP));
    document.getElementById("speedUp").addEventListener("click", () => setPlaybackRate(currentRate + RATE_STEP));
    document.querySelectorAll(".speed-preset").forEach(button => button.addEventListener("click", () => setPlaybackRate(button.dataset.rate)));
    document.getElementById("volumeRange").addEventListener("input", setVolumeFromRange);
    document.getElementById("hostToggle").addEventListener("change", changeHostMode);
    document.getElementById("controlsToggle").addEventListener("change", changeControlsMode);
    document.getElementById("fullscreenToggle").addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") requestWakeLock(); });
    document.addEventListener("keydown", handleKeyboardShortcut);
    document.addEventListener("pointerdown", requestWakeLock, { once: true });
    document.addEventListener("touchstart", requestWakeLock, { once: true, passive: true });

    ["timeTrack", "loopStartHandle", "loopEndHandle"].forEach(id => {
      const element = document.getElementById(id);
      element.addEventListener("pointerdown", handleTrackPointerDown);
      element.addEventListener("pointermove", handleTrackPointerMove);
      element.addEventListener("pointerup", handleTrackPointerUp);
      element.addEventListener("pointercancel", handleTrackPointerUp);
    });

    document.getElementById("loopToggle").addEventListener("change", toggleLoop);
    document.getElementById("loopSetStart").addEventListener("click", setLoopStartAtCurrentTime);
    document.getElementById("loopSetEnd").addEventListener("click", setLoopEndAtCurrentTime);
    document.getElementById("loopBackStart").addEventListener("click", seekLoopStart);
    document.getElementById("loopReset").addEventListener("click", resetLoopRange);
    document.getElementById("skipForward90").addEventListener("click", () => seekBy(SKIP_90_SECONDS));
    document.getElementById("skipBack10").addEventListener("click", () => seekBy(-SKIP_10_SECONDS));
    document.getElementById("skipForward10").addEventListener("click", () => seekBy(SKIP_10_SECONDS));
    document.getElementById("invertToggle").addEventListener("click", toggleInvert);
    document.getElementById("copyBookmarklet").addEventListener("click", copyBookmarklet);

    updateSpeedButton(); updateSpeedControl(); updateInvertButton(); updateFullscreenButton(); updateLoopButton(); updateHostToggle(); updateControlsToggle();
    const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
  </script>
</body>
</html>
